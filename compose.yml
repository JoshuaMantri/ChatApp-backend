services:
  chat-api:
    build: .
    ports:
      - "${API_PORT}:8000"
    volumes:
      - type: bind
        source: /Users/joshuamantri/Development/ChatApp/backend/src
        target: /usr/local/app/src
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mariadb
    restart: always
    environment:
      env_file: "/Users/joshuamantri/Development/ChatApp/backend/.env"
    ports:
    - "3306:3306"

